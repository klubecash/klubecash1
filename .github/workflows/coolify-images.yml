name: Build KlubeCash VPS images

on:
  push:
    branches: [codex/klubcashvps, codex/sales-performance]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: KlubeCashNew/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: npm ci
        working-directory: KlubeCashNew
      - run: npm run typecheck
        working-directory: KlubeCashNew
      - run: npm run lint
        working-directory: KlubeCashNew
      - run: npx vitest run --maxWorkers=1 --reporter=dot
        working-directory: KlubeCashNew
      - run: php scripts/quality/php-lint.php
      - run: php scripts/quality/check-routes.php
      - run: php tests/php/vps_runtime_keys_unit.php
      - run: php tests/php/store_sale_items_unit.php
      - run: php tests/php/store_sales_reporting_integration.php
        env:
          GIFTBACK_TEST_DSN: mysql:host=127.0.0.1;port=3306
          GIFTBACK_TEST_USER: root
          GIFTBACK_TEST_PASSWORD: isolated-test-only
      - name: Validate deployment Compose syntax
        run: docker compose -f deploy/compose.coolify.yml config --quiet
        env:
          KLUBCASH_IMAGE_TAG: test-sha
          KLUBCASH_DB_PASSWORD: test-only
          KLUBCASH_JWT_SECRET: test-only
          KLUBCASH_SMTP_HOST: smtp.example.test
          KLUBCASH_SMTP_USERNAME: test-only
          KLUBCASH_SMTP_PASSWORD: test-only
          KLUBCASH_SMTP_FROM_EMAIL: test@example.test

  images:
    needs: validate
    if: github.ref == 'refs/heads/codex/klubcashvps'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: next
            context: KlubeCashNew
            dockerfile: KlubeCashNew/Dockerfile
          - component: php
            context: .
            dockerfile: Dockerfile.php
          - component: nginx
            context: .
            dockerfile: Dockerfile.nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/klubecash/klubecash1-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
