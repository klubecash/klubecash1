server {
    listen 8080;
    server_name _;
    root /app;
    client_max_body_size 21m;
    server_tokens off;

    location = /internal-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Somente assets e uploads públicos são servidos diretamente.
    location ~ /\. { return 404; }
    location ~ ^/(?:assets|uploads)/.*\.php(?:/|$) { return 404; }
    location ~ ^/(?:assets|uploads)/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/api/vercel-router.php;
        fastcgi_param SCRIPT_NAME /api/vercel-router.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }
}
